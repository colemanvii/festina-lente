<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Festina Lente — Archive</title>
  <meta name="description" content="A quiet archive." />
  <style>
    :root { color-scheme: light; }
    body{
      margin:0; background:#fff; color:#111;
      font: 18px/1.7 Georgia, "Iowan Old Style", "Times New Roman", serif;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    .wrap{ max-width: 720px; margin: 64px auto; padding: 0 22px; }
    header{ margin-bottom: 40px; }
    h1{
      margin:0 0 10px 0; font-size: 44px; line-height: 1.05;
      letter-spacing: -0.02em; font-weight: 600;
    }
    .sub{ margin:0; color:#333; font-size: 18px; }
    .rule{ margin: 34px 0; border:0; height:1px; background:#e6e6e6; }
    .meta{ color:#444; font-size: 15px; margin-top: 12px; }
    .controls{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      margin-top: 18px;
    }
    input[type="search"]{
      flex:1; min-width: 220px;
      border: 1px solid #ddd; border-radius: 10px;
      padding: 10px 12px; font: inherit; font-size: 16px;
    }
    select{
      border: 1px solid #ddd; border-radius: 10px;
      padding: 10px 12px; font: inherit; font-size: 16px;
      background:#fff;
    }
    ul{ list-style:none; padding:0; margin:0; }
    li{ padding: 18px 0; border-bottom: 1px solid #eee; }
    a{ color:inherit; text-decoration:none; }
    a:hover{ text-decoration: underline; text-underline-offset: 3px; }
    .date{ color:#555; font-size: 14px; margin-bottom: 4px; }
    .title{ font-size: 22px; line-height: 1.2; font-weight: 600; margin:0; }
    .excerpt{ margin: 8px 0 0 0; color:#222; }
    .tagline{ color:#666; font-size: 14px; margin-top: 10px; }
    footer{ margin-top: 44px; color:#666; font-size: 14px; }
    .pill{
      display:inline-block; padding: 2px 10px; border: 1px solid #e6e6e6;
      border-radius: 999px; margin-left: 8px; font-size: 12px; color:#555;
    }
    @media (prefers-reduced-motion: no-preference){
      li{ transition: opacity .15s ease; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Festina Lente</h1>
      <p class="sub">Not a feed. An archive. Quiet as snow, clean as paper before the poem.</p>
      <div class="controls">
        <input id="q" type="search" placeholder="Search titles, tags, text…" autocomplete="off" />
        <select id="sort">
          <option value="new">Newest first</option>
          <option value="old">Oldest first</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
        </select>
      </div>
      <div class="meta" id="count"></div>
      <hr class="rule" />
    </header>

    <main>
      <ul id="list"></ul>
      <p class="tagline">To add posts: edit the <code>POSTS</code> array in this file.</p>
    </main>

    <footer>
      <hr class="rule" />
      <div>© <span id="year"></span> • Stored locally • No platform required</div>
    </footer>
  </div>

  <script>
    // 1) ADD/EDIT POSTS HERE.
    //    - date: "YYYY-MM-DD" (for sorting)
    //    - slug: used for filename if you create a local HTML per post (optional)
    //    - url: link to local file or external (optional; if blank, it will open the modal)
    //    - body: full text (optional; shown in modal)
    const POSTS = [
      {
        title: "A House of My Own",
        date: "2026-01-06",
        tags: ["home", "quiet", "own"],
        slug: "a-house-of-my-own",
        excerpt: "A place all my own—porch, pillow, purple petunias…",
        body: `Not a flat. Not an apartment in back. Not a man’s house...`
      },
      {
        title: "The Falling Star",
        date: "2026-01-05",
        tags: ["beauty", "wish", "gone"],
        slug: "the-falling-star",
        excerpt: "Too burning and too quick to hold…",
        body: `I saw a star slide down the sky...`
      }
    ];

    // --- renderer ---
    const $list = document.getElementById("list");
    const $q = document.getElementById("q");
    const $sort = document.getElementById("sort");
    const $count = document.getElementById("count");

    const fmt = (d) => {
      const [y,m,day] = d.split("-").map(Number);
      const dt = new Date(y, m-1, day);
      return dt.toLocaleDateString(undefined, { year:"numeric", month:"long", day:"numeric" });
    };

    function getFiltered(){
      const term = ($q.value || "").trim().toLowerCase();
      let items = POSTS.slice();

      // sort
      const s = $sort.value;
      if (s === "new") items.sort((a,b)=> (b.date||"").localeCompare(a.date||""));
      if (s === "old") items.sort((a,b)=> (a.date||"").localeCompare(b.date||""));
      if (s === "az")  items.sort((a,b)=> (a.title||"").localeCompare(b.title||""));
      if (s === "za")  items.sort((a,b)=> (b.title||"").localeCompare(a.title||""));

      if (!term) return items;

      return items.filter(p=>{
        const hay = [
          p.title, p.excerpt, p.body,
          (p.tags||[]).join(" ")
        ].join("\n").toLowerCase();
        return hay.includes(term);
      });
    }

    function render(){
      const items = getFiltered();
      $list.innerHTML = "";

      items.forEach(p=>{
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = p.url || "#";
        a.addEventListener("click", (e)=>{
          if (!p.url) { e.preventDefault(); openModal(p); }
        });

        const date = document.createElement("div");
        date.className = "date";
        date.textContent = p.date ? fmt(p.date) : "";

        const h = document.createElement("p");
        h.className = "title";
        h.textContent = p.title || "Untitled";

        if (p.tags && p.tags.length){
          const pill = document.createElement("span");
          pill.className = "pill";
          pill.textContent = p.tags[0];
          h.appendChild(pill);
        }

        const ex = document.createElement("p");
        ex.className = "excerpt";
        ex.textContent = p.excerpt || "";

        a.appendChild(date);
        a.appendChild(h);
        if (p.excerpt) a.appendChild(ex);

        li.appendChild(a);
        $list.appendChild(li);
      });

      $count.textContent = `${items.length} post${items.length===1?"":"s"} • stored here`;
    }

    // --- modal (for inline reading) ---
    const modal = document.createElement("dialog");
    modal.style.maxWidth = "760px";
    modal.style.width = "calc(100% - 24px)";
    modal.style.border = "1px solid #e6e6e6";
    modal.style.borderRadius = "16px";
    modal.style.padding = "18px 18px 22px 18px";
    modal.style.font = "inherit";
    modal.innerHTML = `
      <div style="display:flex; justify-content:space-between; gap:12px; align-items:flex-start;">
        <div>
          <div id="mDate" class="date"></div>
          <div id="mTitle" style="font-size:28px; font-weight:600; line-height:1.15;"></div>
          <div id="mTags" style="margin-top:10px; color:#666; font-size:14px;"></div>
        </div>
        <button id="mClose" style="border:1px solid #ddd; background:#fff; border-radius:999px; padding:8px 12px; font:inherit; cursor:pointer;">Close</button>
      </div>
      <hr class="rule" style="margin:18px 0;" />
      <div id="mBody" style="white-space:pre-wrap;"></div>
    `;
    document.body.appendChild(modal);

    function openModal(p){
      modal.querySelector("#mDate").textContent = p.date ? fmt(p.date) : "";
      modal.querySelector("#mTitle").textContent = p.title || "Untitled";
      modal.querySelector("#mTags").textContent = (p.tags && p.tags.length) ? `Tags: ${p.tags.join(", ")}` : "";
      modal.querySelector("#mBody").textContent = p.body || p.excerpt || "";
      modal.showModal();
    }
    modal.querySelector("#mClose").addEventListener("click", ()=> modal.close());
    modal.addEventListener("click", (e)=> { if (e.target === modal) modal.close(); });

    // init
    document.getElementById("year").textContent = new Date().getFullYear();
    $q.addEventListener("input", render);
    $sort.addEventListener("change", render);
    render();
  </script>
</body>
</html>
